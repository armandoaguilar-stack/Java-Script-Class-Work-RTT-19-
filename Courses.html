                <option value="Business" style="display: block; width: 100%; margin-top: 5px; padding: 12px; border: none; border-radius: 10px; background-color: rgb(88, 84, 77); font-size: 12px; color: white; text-align: center; cursor: pointer; box-shadow: 0 5px 15px white; transition: all 0.3s ease;">Business</option>
